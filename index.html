<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سنگ کاغذ قیچی</title>

<style>
body {
    background: linear-gradient(135deg, #10152e, #273c75);
    color: white;
    font-family: Tahoma;
    text-align: center;
    padding: 30px 10px;
}

.container {
    max-width: 450px;
    margin: auto;
    background: #202b50;
    padding: 25px;
    border-radius: 20px;
}

h1 { color: #ffd166; }

.score {
    display: flex;
    justify-content: space-around;
    font-size: 20px;
    margin: 30px 0;
}

button {
    font-size: 24px;
    padding: 15px 20px;
    margin: 7px;
    border: none;
    border-radius: 15px;
    cursor: pointer;
    background: #ffd166;
}

button:hover { background: #ffb703; }

#result {
    font-size: 20px;
    margin: 25px 0;
}

.reset {
    background: #06d6a0;
    font-size: 17px;
}
</style>
</head>

<body>
<div class="container">

<h1>🎮 سنگ کاغذ قیچی</h1>
<h3 style="color:#ffd166;">
ارتین قزل سوفلو"امیررضاخرقانی"امیرمهدی قیدر"سیدحمیدرضامنافی"یاسین سرفراز و ادرین شاهسون
<p style="color:#06da0;">
کلاس 7/2
</p>
<p>به بازی من خوش آمدید!</p>

<div class="score">
    <div>👤 شما<br>{{ player }}</div>
    <div>🤖 کامپیوتر<br>{{ computer }}</div>
</div>

<h3>انتخاب کن:</h3>

<form method="POST">
    <button name="choice" value="سنگ">🪨 سنگ</button>
    <button name="choice" value="کاغذ">📄 کاغذ</button>
    <button name="choice" value="قیچی">✂️ قیچی</button>
</form>

<div id="result">{{ result }}</div>

<h2>{{ winner }}</h2>

<a href="/reset">
<button class="reset">🔄 بازی مجدد</button>
</a>

</div>
</body>
</html>
